name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustup target add wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build WASM
        run: cargo build --target wasm32v1-none --release --locked

      - name: Validate deployment and demo scripts
        run: |
          bash -n scripts/deploy_testnet.sh
          bash -n scripts/deploy_mainnet.sh
          bash -n scripts/demo.sh
          if ./scripts/deploy_mainnet.sh >/dev/null 2>&1; then
            echo "Mainnet deploy script failed to block unflagged execution" >&2
            exit 1
          fi
