[workspace]
resolver = "2"
members = ["contracts/escrow", "contracts/vault"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/umbra-escrow-and-dispute-window/umbra-contracts"

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
